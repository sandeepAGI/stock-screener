<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e3a5f"/>
      <stop offset="100%" style="stop-color:#0d1b2a"/>
    </linearGradient>
    <linearGradient id="chart" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" style="stop-color:#2ecc71"/>
      <stop offset="100%" style="stop-color:#27ae60"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1024" height="1024" rx="200" fill="url(#bg)"/>

  <!-- Chart bars -->
  <rect x="200" y="500" width="100" height="300" rx="10" fill="url(#chart)" opacity="0.8"/>
  <rect x="350" y="400" width="100" height="400" rx="10" fill="url(#chart)" opacity="0.9"/>
  <rect x="500" y="300" width="100" height="500" rx="10" fill="url(#chart)"/>
  <rect x="650" y="350" width="100" height="450" rx="10" fill="url(#chart)" opacity="0.9"/>
  <rect x="800" y="250" width="100" height="550" rx="10" fill="url(#chart)" opacity="0.8"/>

  <!-- Trend line -->
  <path d="M220 480 L400 380 L550 280 L700 320 L850 220"
        stroke="#4dabf7" stroke-width="12" stroke-linecap="round"
        stroke-linejoin="round" fill="none"/>

  <!-- Data points -->
  <circle cx="220" cy="480" r="18" fill="#4dabf7"/>
  <circle cx="400" cy="380" r="18" fill="#4dabf7"/>
  <circle cx="550" cy="280" r="18" fill="#4dabf7"/>
  <circle cx="700" cy="320" r="18" fill="#4dabf7"/>
  <circle cx="850" cy="220" r="18" fill="#4dabf7"/>

  <!-- Outlier highlight -->
  <circle cx="550" cy="280" r="35" stroke="#f39c12" stroke-width="6" fill="none"/>
</svg>
